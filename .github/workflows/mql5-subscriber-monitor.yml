name: MQL5 订阅数据每小时检测（首次+变动通知）
on:
  schedule:
    - cron: '0 * * * *'  # 每小时第0分钟执行
  workflow_dispatch:  # 手动触发测试

jobs:
  check-subscribers:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 读取历史订阅数据缓存
        uses: actions/cache@v3
        id: mql5-cache
        with:
          path: ./mql5_subscribers.json
          key: ${{ runner.os }}-mql5-subs
          restore-keys: |
            ${{ runner.os }}-mql5-subs

      - name: 配置Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安装Python依赖库
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4

      # 核心修改：新增首次运行通知逻辑
      - name: 生成MQL5数据处理脚本
        run: |
          cat > mql5_subs_checker.py << 'EOF'
          import requests
          from bs4 import BeautifulSoup
          import json
          import os
          from datetime import datetime

          # ========== 基础配置 ==========
          AUTHOR_URL = "https://www.mql5.com/zh/signals/author/wanbaolu"
          DATA_FILE = "mql5_subscribers.json"
          USER_AGENT = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          # ========== 企业微信通知 ==========
          def send_wechat_alert(content):
              webhook = os.getenv("WECHAT_WEBHOOK")
              if not webhook:
                  print("⚠️ 未配置企业微信Webhook，跳过通知")
                  return
              try:
                  resp = requests.post(
                      url=webhook,
                      json={"msgtype": "text", "text": {"content": content}},
                      timeout=15
                  )
                  resp.raise_for_status()
                  print("✅ 企业微信通知发送成功")
              except Exception as e:
                  print(f"❌ 通知发送失败：{str(e)}")

          # ========== 抓取最新订阅数据 ==========
          def get_latest_subscribers():
              print(f"📅 {datetime.now().strftime('%Y-%m-%d %H:%M:%S')} - 开始抓取MQL5数据")
              headers = {"User-Agent": USER_AGENT}
              try:
                  resp = requests.get(AUTHOR_URL, headers=headers, timeout=20)
                  resp.raise_for_status()
              except requests.RequestException as e:
                  print(f"❌ 数据抓取失败：{str(e)}")
                  return {}

              soup = BeautifulSoup(resp.text, "html.parser")
              subs_data = {}
              for row in soup.select("div.row.signal"):
                  name_tag = row.select_one(".signal .name a")
                  subs_tag = row.select_one(".col-subscribers")
                  if not (name_tag and subs_tag):
                      continue
                  
                  signal_name = name_tag.text.strip()
                  signal_url = f"https://www.mql5.com{name_tag.get('href', '')}"
                  subs_str = subs_tag.text.strip().replace(",", "")
                  subs_count = int(subs_str) if subs_str.isdigit() else 0

                  subs_data[signal_name] = {
                      "subscribers": subs_count,
                      "url": signal_url,
                      "update_time": datetime.now().strftime("%Y-%m-%d %H:%M:%S")
                  }
              print(f"✅ 抓取完成，共获取 {len(subs_data)} 个信号数据")
              return subs_data

          # ========== 读取/保存缓存数据 ==========
          def load_history_data():
              if os.path.exists(DATA_FILE):
                  try:
                      with open(DATA_FILE, "r", encoding="utf-8") as f:
                          return json.load(f)
                  except json.JSONDecodeError:
                      print("⚠️ 历史缓存文件损坏，重新初始化")
              return {}

          def save_current_data(data):
              with open(DATA_FILE, "w", encoding="utf-8") as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
              print(f"✅ 最新数据已保存至缓存文件")

          # ========== 核心逻辑：首次通知+变动通知+缓存更新 ==========
          def main():
              latest_data = get_latest_subscribers()
              if not latest_data:
                  print("❌ 无有效数据，终止本次执行")
                  return
              history_data = load_history_data()

              # 新增：判断是否为首次运行（历史数据为空 = 首次）
              if not history_data:
                  print("🔔 检测到首次运行，发送初始化通知")
                  # 组装首次运行通知内容（含所有初始信号列表）
                  initial_signals = []
                  for name, info in latest_data.items():
                      initial_signals.append(
                          f"《{name}》\n"
                          f"  订阅数：{info['subscribers']} 人\n"
                          f"  链接：{info['url']}"
                      )
                  first_notify = (
                      f"🎉 MQL5 订阅监控首次运行成功\n"
                      f"⏰ 初始化时间：{datetime.now().strftime('%Y-%m-%d %H:%M:%S')}\n"
                      f"📊 初始信号总数：{len(latest_data)} 个\n\n"
                      f"—— 初始信号列表 ——\n"
                      f"{chr(10).join(initial_signals)}"
                  )
                  print(f"\n{first_notify}")
                  send_wechat_alert(first_notify)  # 发送首次通知
                  save_current_data(latest_data)   # 保存首次缓存
                  return  # 首次运行无需对比，直接结束

              # 非首次运行：对比差异（新增/删除/变动）
              changes = []
              # 检查新增/变动信号
              for name, latest_info in latest_data.items():
                  if name not in history_data:
                      changes.append(
                          f"🆕 新增信号：《{name}》\n"
                          f"📍 订阅数：{latest_info['subscribers']} 人\n"
                          f"🔗 链接：{latest_info['url']}"
                      )
                  else:
                      history_subs = history_data[name]["subscribers"]
                      latest_subs = latest_info["subscribers"]
                      if latest_subs != history_subs:
                          diff = latest_subs - history_subs
                          trend = "📈 增加" if diff > 0 else "📉 减少"
                          changes.append(
                              f"🔄 信号变动：《{name}》\n"
                              f"{trend} {abs(diff)} 人 → 当前 {latest_subs} 人\n"
                              f"🔗 链接：{latest_info['url']}"
                          )
              # 检查已删除信号
              for name in history_data:
                  if name not in latest_data:
                      changes.append(
                          f"🗑️ 信号移除：《{name}》\n"
                          f"📍 原订阅数：{history_data[name]['subscribers']} 人"
                      )

              # 有变动则推送通知
              if changes:
                  notify_content = (
                      f"📢 MQL5 订阅数据变动通知\n"
                      f"⏰ 检测时间：{datetime.now().strftime('%Y-%m-%d %H:%M:%S')}\n"
                      f"🔍 变动数量：{len(changes)} 项\n\n"
                      f"—— 详细变动 ——\n"
                      f"{chr(10).join(changes)}"
                  )
                  print(f"\n{notify_content}")
                  send_wechat_alert(notify_content)
              else:
                  print("✅ 订阅数据无变动，无需通知")

              # 更新缓存为最新数据
              save_current_data(latest_data)

          if __name__ == "__main__":
              main()
          EOF
          echo "✅ MQL5数据处理脚本生成完成"

      - name: 执行订阅数据检测
        env:
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK_URL }}
        run: |
          python mql5_subs_checker.py

      - name: 查看最新缓存数据（调试用）
        if: always()
        run: |
          echo -e "\n📄 最新缓存文件内容："
          if [ -f "./mql5_subscribers.json" ]; then
            cat ./mql5_subscribers.json
          else
            echo "❌ 缓存文件未生成"
          fi
