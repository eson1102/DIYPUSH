name: 可转债申购提醒

on:
  # ========== 定时触发：北京时间 9:00 和 14:00 ==========
  # UTC 时间 1:00 = 北京时间 9:00
  # UTC 时间 6:00 = 北京时间 14:00
  schedule:
    - cron: '0 1 * * *'   # 每天 UTC 1:00 → 北京时间 9:00
    - cron: '0 6 * * *'   # 每天 UTC 6:00 → 北京时间 14:00
  
  # 允许手动触发（方便测试）
  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: 安装依赖
        run: |
          pip install -r requirements.txt
      
      - name: 运行可转债申购提醒
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          python kezhuanzhai.py
      
      - name: 失败通知
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -d '{"msgtype":"text","text":{"content":"❌ 可转债申购提醒任务执行失败，请检查日志"}}' \
            $WEBHOOK_URL
