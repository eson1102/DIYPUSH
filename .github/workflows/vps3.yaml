name: VPS Status Monitor

on:
  schedule:
    # 每天运行两次（UTC时间0点和12点，对应北京时间8点和20点）
    - cron: '0 0,12 * * *'
  workflow_dispatch:  # 允许手动触发
    inputs:
      skip_notification:
        description: '跳过企业微信通知'
        type: boolean
        default: false
        required: false

jobs:
  check-vps:
    runs-on: ubuntu-latest
    continue-on-error: true  # 即使有错误也继续执行，不会标记为失败
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 prettytable
        
    - name: Run VPS Monitor
      id: monitor
      env:
        WECHAT_WEBHOOK_URL111: ${{ secrets.WECHAT_WEBHOOK_URL111 }}
      run: |
        python vps_monitor_fixed.py
        
    - name: Check for errors
      if: always()
      run: |
        # 这里可以添加错误检查逻辑
        echo "检查完成"
        
    - name: Create summary file
      if: always()
      run: |
        echo "# VPS监控报告" > summary.md
        echo "运行时间: $(date)" >> summary.md
        echo "工作流: ${{ github.workflow }}" >> summary.md
        echo "触发方式: ${{ github.event_name }}" >> summary.md
        echo "" >> summary.md
        echo "更多详细信息请查看运行日志。" >> summary.md
        
    - name: Upload summary
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: vps-monitor-summary
        path: summary.md
        
    - name: Send success notification
      if: success() && github.event_name != 'schedule' && !inputs.skip_notification
      run: |
        echo "✅ VPS监控手动执行成功"
        
    - name: Send failure notification
      if: failure() && github.event_name != 'schedule' && !inputs.skip_notification
      run: |
        echo "❌ VPS监控执行失败"
