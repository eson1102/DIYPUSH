name: VPS Status Monitor

on:
  schedule:
    # 每天运行两次（UTC时间0点和12点，对应北京时间8点和20点）
    - cron: '0 0 * * *'
  workflow_dispatch:  # 允许手动触发
    inputs:
      skip_notification:
        description: '跳过企业微信通知'
        type: boolean
        default: false
        required: false

# 设置环境变量
env:
  PYTHONUNBUFFERED: 1
  TZ: Asia/Shanghai

jobs:
  monitor:
    name: Monitor VPS Status
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run VPS Monitor
      id: monitor
      env:
        WECHAT_WEBHOOK_URL111: ${{ secrets.WECHAT_WEBHOOK_URL111 }}
      run: |
        python wikifx.py
        
    - name: Create summary file
      if: always()
      run: |
        # 创建总结文件
        echo "# VPS监控报告" > SUMMARY.md
        echo "" >> SUMMARY.md
        echo "## 执行信息" >> SUMMARY.md
        echo "- **运行时间:** $(date '+%Y-%m-%d %H:%M:%S')" >> SUMMARY.md
        echo "- **工作流:** ${{ github.workflow }}" >> SUMMARY.md
        echo "- **触发方式:** ${{ github.event_name }}" >> SUMMARY.md
        echo "- **仓库:** ${{ github.repository }}" >> SUMMARY.md
        echo "- **提交:** ${{ github.sha }}" >> SUMMARY.md
        echo "" >> SUMMARY.md
        echo "## 检查状态" >> SUMMARY.md
        echo "脚本已执行完成。" >> SUMMARY.md
        echo "" >> SUMMARY.md
        echo "详细日志请查看运行输出。" >> SUMMARY.md
        
    - name: Upload summary
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: vps-monitor-summary
        path: SUMMARY.md
        retention-days: 7
        
    - name: Complete workflow
      if: always()
      run: |
        echo "🎉 VPS监控工作流执行完成"
        echo "运行时间: $(date)"
        echo "事件类型: ${{ github.event_name }}"
