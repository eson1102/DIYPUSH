name: Mindvideo每日自动签到

on:
  schedule:
    # 每天北京时间早上8点运行（UTC时间0点）
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许你手动触发

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3
      
      - name: 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: 安装依赖
        run: pip install -r requirements.txt
      
      - name: 运行签到脚本
        env:
          TOKEN: ${{ secrets.TOKEN }}
        run: python Mindvideo_checkin.py
