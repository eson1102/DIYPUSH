name: 处理并上传 Clash YAML

on:
  workflow_dispatch:

jobs:
  process_upload:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 安装依赖包
        run: |
          pip install requests cos-python-sdk-v5

      - name: 获取 Clash 配置并上传到腾讯云 COS
        env:
          SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          REGION: 'ap-shanghai'
          BUCKET: 'chitu-1251006555'
        run: |
          python -c "
import requests
from qcloud_cos import CosConfig, CosS3Client
import os

# Clash 配置文件 URL
url = 'https://misub-d0t.pages.dev/profiles/dafd961f-bcb2-4c0b-9dbd-2fe3ca591923?clash'
headers = {'User-Agent': 'Clash/Windows'}

# 从环境变量读取腾讯云配置
secret_id = os.environ['SECRET_ID']
secret_key = os.environ['SECRET_KEY']
region = os.environ['REGION']
bucket = os.environ['BUCKET']

# 获取 Clash 配置内容
response = requests.get(url, headers=headers, timeout=200)
response.raise_for_status()
file_content = response.content

# 打印获取到的内容前 300 字符
text = file_content.decode('utf-8', errors='replace')
print('获取到的内容（前 300 字符）:')
print(text[:300])

# 初始化腾讯云 COS 客户端
config = CosConfig(Region=region, SecretId=secret_id, SecretKey=secret_key)
cos_client = CosS3Client(config)

# 上传到 COS
upload_response = cos_client.put_object(
    Bucket=bucket,
    Body=file_content,
    Key='1',
)

# 打印上传结果前 300 字符
upload_str = str(upload_response)
print('上传响应（前 300 字符）:')
print(upload_str[:300])

print('Clash 文件更新及日志输出完成！')
          "
