name: Tencent Cloud Lighthouse Check

on:
  schedule:
    # 每天上午 10:00 (UTC 时间是 02:00) 运行一次
    - cron: '0 2 * * *'
  workflow_dispatch: # 允许手动点击按钮运行

jobs:
  check_instances:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
                # 1. 升级 pip 到最新版，并增加网络容错
                python -m pip install --upgrade pip
                
                # 2. 设置 pip 全局超时时间为 300 秒，防止网络卡顿导致死锁
                pip config set global.timeout 300
                
                # 3. 尝试分步安装，避免一次性并发下载多个大包
                pip install requests
                pip install tencentcloud-sdk-python-common
                pip install tencentcloud-sdk-python-lighthouse

      - name: Run Check Script
        env:
          ACCOUNT_CONFIG: ${{ secrets.ACCOUNT_CONFIG }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: python check_tencent_cloud.py
  # 新增：LayerCraft 每日签到任务
  layercraft_checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip config set global.timeout 300
          pip install requests

      - name: Execute qiandao.py 签到脚本
        run: python qiandao.py
