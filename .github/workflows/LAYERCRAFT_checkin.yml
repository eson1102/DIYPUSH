name: LayerCraft Auto Checkin

on:
  schedule:
    # 每天 UTC 时间 00:00 运行（北京时间 08:00）
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
    
    - name: Run checkin script
      env:
        LAYERCRAFT_EMAIL: ${{ secrets.LAYERCRAFT_EMAIL }}
        LAYERCRAFT_PASSWORD: ${{ secrets.LAYERCRAFT_PASSWORD }}
        WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        DEBUG: ${{ secrets.DEBUG || 'false' }}
      run: python qiandao.py
