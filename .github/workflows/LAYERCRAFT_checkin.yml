name: LayerCraft Auto Checkin

on:
  schedule:
    # 每天 UTC 时间 00:00 运行（北京时间 08:00）
    - cron: '0 0 * * *'
    # 每天 UTC 时间 16:00 运行（北京时间 24:00）作为备用
    - cron: '0 16 * * *'
  # 允许手动触发
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
    
    - name: Run checkin script (Debug模式)
      env:
        LAYERCRAFT_EMAIL: ${{ secrets.LAYERCRAFT_EMAIL }}
        LAYERCRAFT_PASSWORD: ${{ secrets.LAYERCRAFT_PASSWORD }}
        WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        DEBUG: ${{ secrets.DEBUG || 'true' }}  # 默认开启 Debug 模式
      run: python qiandao.py
    
    - name: Upload debug logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: checkin-logs
        path: |
          *.log
          *.txt
        retention-days: 7
